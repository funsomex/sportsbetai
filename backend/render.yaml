# Render Blueprint - Backend
services:
  - type: web
    name: sportsbetai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: sportsbetai
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: EMERGENT_LLM_KEY
        sync: false
